<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <!-- <style>
        #form{
            border-radius: 25px;
        }
    </style> -->
</head>
<body>
    
    <div class="container mt-3 col-md-6">
        <div class="card rounded-lg" id="form">
            <div class="card-header bg-warning text-white ">
                <h3 class="text-center">Formulaire d'inscription</h3>
            </div>
            <div class="card-body">
                <form action="">
                    <div class="form-group">
                        <label for="">Prenom</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="form-group mt-3">
                        <label for="">Nom</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="" class="form-label">Email</label>
                        <input
                            type="email"
                            class="form-control"
                        />
                    </div>
                    
                    <div class="form-group">
                        <label for="">Pays</label>
                        <select name="" id="" class="form-control">
                            <option value="">Veuillez selectionner votre pays</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="">Message</label>
                    <textarea name="" id="" class="form-control"></textarea>
                    </div>
                    <button type="submit" class="btn btn-outline-success mt-3">Créer mon compte</button>
                    <button type="reset" class="btn btn-danger mt-3">Annuler</button>
                </form>
            </div>
        </div>       
        
    </div>

    <script src="bootstrap.bundle.min.js"></script>
</body>
</html>
